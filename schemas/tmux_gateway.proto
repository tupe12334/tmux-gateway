syntax = "proto3";

package tmux_gateway;

// TmuxGateway provides a gRPC interface to tmux operations.
// See: https://man.openbsd.org/tmux
service TmuxGateway {
  // List all sessions. See: https://man.openbsd.org/tmux#list-sessions
  rpc Ls(LsRequest) returns (LsResponse);
  // Create a new session. See: https://man.openbsd.org/tmux#new-session
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse);
  // Destroy a session. See: https://man.openbsd.org/tmux#kill-session
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);
  // Destroy a window. See: https://man.openbsd.org/tmux#kill-window
  rpc KillWindow(KillWindowRequest) returns (KillWindowResponse);
  // Destroy a pane. See: https://man.openbsd.org/tmux#kill-pane
  rpc KillPane(KillPaneRequest) returns (KillPaneResponse);
  // List windows in a session. See: https://man.openbsd.org/tmux#list-windows
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsResponse);
  // List panes in a window. See: https://man.openbsd.org/tmux#list-panes
  rpc ListPanes(ListPanesRequest) returns (ListPanesResponse);
  // Send key(s) to a pane. See: https://man.openbsd.org/tmux#send-keys
  rpc SendKeys(SendKeysRequest) returns (SendKeysResponse);
  // Rename a session. See: https://man.openbsd.org/tmux#rename-session
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  // Rename a window. See: https://man.openbsd.org/tmux#rename-window
  rpc RenameWindow(RenameWindowRequest) returns (RenameWindowResponse);
  // Create a new window. See: https://man.openbsd.org/tmux#new-window
  rpc NewWindow(NewWindowRequest) returns (NewWindowResponse);
  // Split a pane to create a new pane. See: https://man.openbsd.org/tmux#split-window
  rpc SplitWindow(SplitWindowRequest) returns (SplitWindowResponse);
  // Capture pane contents. See: https://man.openbsd.org/tmux#capture-pane
  rpc CapturePane(CapturePaneRequest) returns (CapturePaneResponse);
  // Capture pane contents with options. See: https://man.openbsd.org/tmux#capture-pane
  rpc CapturePaneWithOptions(CapturePaneWithOptionsRequest) returns (CapturePaneWithOptionsResponse);
  // Create a session with multiple windows. See: https://man.openbsd.org/tmux#new-session
  rpc CreateSessionWithWindows(CreateSessionWithWindowsRequest) returns (CreateSessionWithWindowsResponse);
  // Swap two panes. See: https://man.openbsd.org/tmux#swap-pane
  rpc SwapPanes(SwapPanesRequest) returns (SwapPanesResponse);
  // Move a window to another session. See: https://man.openbsd.org/tmux#move-window
  rpc MoveWindow(MoveWindowRequest) returns (MoveWindowResponse);
  // Select (activate) a window. See: https://man.openbsd.org/tmux#select-window
  rpc SelectWindow(SelectWindowRequest) returns (SelectWindowResponse);
  // Select (activate) a pane. See: https://man.openbsd.org/tmux#select-pane
  rpc SelectPane(SelectPaneRequest) returns (SelectPaneResponse);
  // Resize a pane. See: https://man.openbsd.org/tmux#resize-pane
  rpc ResizePane(ResizePaneRequest) returns (ResizePaneResponse);
  // Apply a layout to a window. See: https://man.openbsd.org/tmux#select-layout
  rpc SelectLayout(SelectLayoutRequest) returns (SelectLayoutResponse);
  // Get a tmux option. See: https://man.openbsd.org/tmux#show-options
  rpc GetOption(GetOptionRequest) returns (GetOptionResponse);
  // Set a tmux option. See: https://man.openbsd.org/tmux#set-option
  rpc SetOption(SetOptionRequest) returns (SetOptionResponse);
  // List tmux options. See: https://man.openbsd.org/tmux#show-options
  rpc ListOptions(ListOptionsRequest) returns (ListOptionsResponse);
  // Stream pane output. See: https://man.openbsd.org/tmux#capture-pane
  rpc StreamPaneOutput(StreamPaneOutputRequest) returns (stream StreamPaneOutputResponse);
}

message LsRequest {}

message LsResponse {
  repeated TmuxSession sessions = 1;
}

// A tmux session. See: https://man.openbsd.org/tmux#CLIENTS_AND_SESSIONS
message TmuxSession {
  string id = 1;
  string name = 2;
  uint32 windows = 3;
  int64 created = 4;
  bool attached = 5;
}

message NewSessionRequest {
  string name = 1;
  string command = 2;
}

message NewSessionResponse {
  string id = 1;
  string name = 2;
  uint32 windows = 3;
  int64 created = 4;
  bool attached = 5;
}

message KillSessionRequest {
  string target = 1;
}

message KillSessionResponse {}

message KillWindowRequest {
  string target = 1;
}

message KillWindowResponse {}

message KillPaneRequest {
  string target = 1;
}

message KillPaneResponse {}

message ListWindowsRequest {
  string session = 1;
}

message ListWindowsResponse {
  repeated TmuxWindow windows = 1;
}

// A tmux window. See: https://man.openbsd.org/tmux#WINDOWS_AND_PANES
message TmuxWindow {
  string id = 1;
  uint32 index = 2;
  string name = 3;
  uint32 panes = 4;
  bool active = 5;
}

message ListPanesRequest {
  string target = 1;
}

message ListPanesResponse {
  repeated TmuxPaneMsg panes = 1;
}

// A tmux pane. See: https://man.openbsd.org/tmux#WINDOWS_AND_PANES
message TmuxPaneMsg {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bool active = 4;
  string current_path = 5;
  string current_command = 6;
  uint32 pid = 7;
}

message SendKeysRequest {
  string target = 1;
  repeated string keys = 2;
}

message SendKeysResponse {}

message RenameSessionRequest {
  string target = 1;
  string new_name = 2;
}

message RenameSessionResponse {}

message RenameWindowRequest {
  string target = 1;
  string new_name = 2;
}

message RenameWindowResponse {}

message NewWindowRequest {
  string session = 1;
  string name = 2;
  string command = 3;
}

message NewWindowResponse {
  string id = 1;
  uint32 index = 2;
  string name = 3;
  uint32 panes = 4;
  bool active = 5;
}

message SplitWindowRequest {
  string target = 1;
  bool horizontal = 2;
  string command = 3;
}

message SplitWindowResponse {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bool active = 4;
  string current_path = 5;
  string current_command = 6;
  uint32 pid = 7;
}

message CapturePaneRequest {
  string target = 1;
}

message CapturePaneResponse {
  string content = 1;
}

message CapturePaneWithOptionsRequest {
  string target = 1;
  bool has_start_line = 2;
  int32 start_line = 3;
  bool has_end_line = 4;
  int32 end_line = 5;
  bool escape_sequences = 6;
}

message CapturePaneWithOptionsResponse {
  string content = 1;
}

message CreateSessionWithWindowsRequest {
  string name = 1;
  repeated string window_names = 2;
}

message CreateSessionWithWindowsResponse {
  string id = 1;
  string name = 2;
  uint32 windows = 3;
  int64 created = 4;
  bool attached = 5;
}

message SwapPanesRequest {
  string src = 1;
  string dst = 2;
}

message SwapPanesResponse {}

message MoveWindowRequest {
  string source = 1;
  string destination_session = 2;
}

message MoveWindowResponse {}

message SelectWindowRequest {
  string target = 1;
}

message SelectWindowResponse {}

message SelectPaneRequest {
  string target = 1;
}

message SelectPaneResponse {}

message ResizePaneRequest {
  string target = 1;
  string direction = 2;
  uint32 amount = 3;
}

message ResizePaneResponse {}

message SelectLayoutRequest {
  string target = 1;
  string layout = 2;
}

message SelectLayoutResponse {}

// A tmux option. See: https://man.openbsd.org/tmux#OPTIONS
message GetOptionRequest {
  string name = 1;
  string scope = 2;
  string target = 3;
}

message GetOptionResponse {
  string name = 1;
  string value = 2;
  string scope = 3;
}

message SetOptionRequest {
  string name = 1;
  string value = 2;
  string scope = 3;
  string target = 4;
}

message SetOptionResponse {}

message ListOptionsRequest {
  string scope = 1;
  string target = 2;
}

message ListOptionsResponse {
  repeated TmuxOptionMsg options = 1;
}

// A tmux option (name-value pair with scope). See: https://man.openbsd.org/tmux#OPTIONS
message TmuxOptionMsg {
  string name = 1;
  string value = 2;
  string scope = 3;
}

message StreamPaneOutputRequest {
  string target = 1;
  uint32 interval_ms = 2;
}

message StreamPaneOutputResponse {
  string content = 1;
  int64 timestamp = 2;
}
