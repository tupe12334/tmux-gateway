syntax = "proto3";

package tmux_gateway;

service TmuxGateway {
  rpc Ls(LsRequest) returns (LsResponse);
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse);
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);
  rpc KillWindow(KillWindowRequest) returns (KillWindowResponse);
  rpc KillPane(KillPaneRequest) returns (KillPaneResponse);
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsResponse);
  rpc ListPanes(ListPanesRequest) returns (ListPanesResponse);
  rpc SendKeys(SendKeysRequest) returns (SendKeysResponse);
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  rpc RenameWindow(RenameWindowRequest) returns (RenameWindowResponse);
  rpc NewWindow(NewWindowRequest) returns (NewWindowResponse);
  rpc SplitWindow(SplitWindowRequest) returns (SplitWindowResponse);
  rpc CapturePane(CapturePaneRequest) returns (CapturePaneResponse);
  rpc CapturePaneWithOptions(CapturePaneWithOptionsRequest) returns (CapturePaneWithOptionsResponse);
  rpc CreateSessionWithWindows(CreateSessionWithWindowsRequest) returns (CreateSessionWithWindowsResponse);
  rpc SwapPanes(SwapPanesRequest) returns (SwapPanesResponse);
  rpc MoveWindow(MoveWindowRequest) returns (MoveWindowResponse);
  rpc SelectWindow(SelectWindowRequest) returns (SelectWindowResponse);
  rpc SelectPane(SelectPaneRequest) returns (SelectPaneResponse);
  rpc ResizePane(ResizePaneRequest) returns (ResizePaneResponse);
  rpc SelectLayout(SelectLayoutRequest) returns (SelectLayoutResponse);
  rpc GetOption(GetOptionRequest) returns (GetOptionResponse);
  rpc SetOption(SetOptionRequest) returns (SetOptionResponse);
  rpc ListOptions(ListOptionsRequest) returns (ListOptionsResponse);
  rpc StreamPaneOutput(StreamPaneOutputRequest) returns (stream StreamPaneOutputResponse);
}

message LsRequest {}

message LsResponse {
  repeated TmuxSession sessions = 1;
}

message TmuxSession {
  string id = 1;
  string name = 2;
  uint32 windows = 3;
  int64 created = 4;
  bool attached = 5;
}

message NewSessionRequest {
  string name = 1;
  string command = 2;
}

message NewSessionResponse {
  string id = 1;
  string name = 2;
  uint32 windows = 3;
  int64 created = 4;
  bool attached = 5;
}

message KillSessionRequest {
  string target = 1;
}

message KillSessionResponse {}

message KillWindowRequest {
  string target = 1;
}

message KillWindowResponse {}

message KillPaneRequest {
  string target = 1;
}

message KillPaneResponse {}

message ListWindowsRequest {
  string session = 1;
}

message ListWindowsResponse {
  repeated TmuxWindow windows = 1;
}

message TmuxWindow {
  string id = 1;
  uint32 index = 2;
  string name = 3;
  uint32 panes = 4;
  bool active = 5;
}

message ListPanesRequest {
  string target = 1;
}

message ListPanesResponse {
  repeated TmuxPaneMsg panes = 1;
}

message TmuxPaneMsg {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bool active = 4;
  string current_path = 5;
  string current_command = 6;
  uint32 pid = 7;
}

message SendKeysRequest {
  string target = 1;
  repeated string keys = 2;
}

message SendKeysResponse {}

message RenameSessionRequest {
  string target = 1;
  string new_name = 2;
}

message RenameSessionResponse {}

message RenameWindowRequest {
  string target = 1;
  string new_name = 2;
}

message RenameWindowResponse {}

message NewWindowRequest {
  string session = 1;
  string name = 2;
  string command = 3;
}

message NewWindowResponse {
  string id = 1;
  uint32 index = 2;
  string name = 3;
  uint32 panes = 4;
  bool active = 5;
}

message SplitWindowRequest {
  string target = 1;
  bool horizontal = 2;
  string command = 3;
}

message SplitWindowResponse {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bool active = 4;
  string current_path = 5;
  string current_command = 6;
  uint32 pid = 7;
}

message CapturePaneRequest {
  string target = 1;
}

message CapturePaneResponse {
  string content = 1;
}

message CapturePaneWithOptionsRequest {
  string target = 1;
  bool has_start_line = 2;
  int32 start_line = 3;
  bool has_end_line = 4;
  int32 end_line = 5;
  bool escape_sequences = 6;
}

message CapturePaneWithOptionsResponse {
  string content = 1;
}

message CreateSessionWithWindowsRequest {
  string name = 1;
  repeated string window_names = 2;
}

message CreateSessionWithWindowsResponse {
  string id = 1;
  string name = 2;
  uint32 windows = 3;
  int64 created = 4;
  bool attached = 5;
}

message SwapPanesRequest {
  string src = 1;
  string dst = 2;
}

message SwapPanesResponse {}

message MoveWindowRequest {
  string source = 1;
  string destination_session = 2;
}

message MoveWindowResponse {}

message SelectWindowRequest {
  string target = 1;
}

message SelectWindowResponse {}

message SelectPaneRequest {
  string target = 1;
}

message SelectPaneResponse {}

message ResizePaneRequest {
  string target = 1;
  string direction = 2;
  uint32 amount = 3;
}

message ResizePaneResponse {}

message SelectLayoutRequest {
  string target = 1;
  string layout = 2;
}

message SelectLayoutResponse {}

message GetOptionRequest {
  string name = 1;
  string scope = 2;
  string target = 3;
}

message GetOptionResponse {
  string name = 1;
  string value = 2;
  string scope = 3;
}

message SetOptionRequest {
  string name = 1;
  string value = 2;
  string scope = 3;
  string target = 4;
}

message SetOptionResponse {}

message ListOptionsRequest {
  string scope = 1;
  string target = 2;
}

message ListOptionsResponse {
  repeated TmuxOptionMsg options = 1;
}

message TmuxOptionMsg {
  string name = 1;
  string value = 2;
  string scope = 3;
}

message StreamPaneOutputRequest {
  string target = 1;
  uint32 interval_ms = 2;
}

message StreamPaneOutputResponse {
  string content = 1;
  int64 timestamp = 2;
}

